<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" class="crest-vector-svg">
  <defs>
    <linearGradient id="alrocGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C57B"/>
      <stop offset="35%" stop-color="#C59B46"/>
      <stop offset="70%" stop-color="#A47B2C"/>
      <stop offset="100%" stop-color="#7A5618"/>
    </linearGradient>
    <linearGradient id="alrocGoldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(226, 197, 123, 0.28)"/>
      <stop offset="100%" stop-color="rgba(122, 86, 24, 0.08)"/>
    </linearGradient>
    <linearGradient id="crownGemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5E48"/>
      <stop offset="100%" stop-color="#142B20"/>
    </linearGradient>
    <filter id="alrocCrestShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4A340E" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- SÍMBOLO MAESTRO: TRIÁNGULO ARQUITECTÓNICO CON DOBLE FILETE Y CORONA EN EL VÉRTICE -->
  <g filter="url(#alrocCrestShadow)">
    <!-- Triángulo Exterior Arquitectónico -->
    <polygon points="60,42 20,108 100,108" fill="url(#alrocGoldFill)" stroke="url(#alrocGoldGrad)" stroke-width="2.6" stroke-linejoin="round"/>
    
    <!-- Triángulo Interior (Filete Paspartú Victoriano) -->
    <polygon points="60,53 29,101 91,101" fill="none" stroke="url(#alrocGoldGrad)" stroke-width="1.1" stroke-opacity="0.8" stroke-linejoin="round"/>

    <!-- Chevron & Ojo Arquitectónico / Compás Central -->
    <path d="M 60,65 L 47,88 L 73,88 Z" fill="rgba(184, 142, 62, 0.18)" stroke="url(#alrocGoldGrad)" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="60" cy="78" r="2.8" fill="url(#alrocGoldGrad)"/>
    
    <!-- Remates de Esquina en la Base del Triángulo -->
    <circle cx="20" cy="108" r="2.5" fill="url(#alrocGoldGrad)"/>
    <circle cx="100" cy="108" r="2.5" fill="url(#alrocGoldGrad)"/>
    <line x1="20" y1="112" x2="100" y2="112" stroke="url(#alrocGoldGrad)" stroke-width="1" stroke-linecap="round" stroke-opacity="0.7"/>
    
    <!-- ============================================== -->
    <!-- CORONA VICTORIANA REAL EN EL VÉRTICE SUPERIOR -->
    <!-- ============================================== -->
    <!-- Cintillo / Diadema de la Corona (Base de apoyo en el vértice 60,42) -->
    <rect x="42" y="37" width="36" height="7" rx="1.8" fill="url(#alrocGoldGrad)" stroke="#5B3E10" stroke-width="0.7"/>
    
    <!-- Pedrería Incrustada en el Cintillo -->
    <circle cx="47" cy="40.5" r="1.3" fill="#FFFFFF"/>
    <circle cx="53.5" cy="40.5" r="1.4" fill="url(#crownGemGrad)"/>
    <circle cx="60" cy="40.5" r="1.7" fill="#FFFFFF"/>
    <circle cx="66.5" cy="40.5" r="1.4" fill="url(#crownGemGrad)"/>
    <circle cx="73" cy="40.5" r="1.3" fill="#FFFFFF"/>

    <!-- Cuerpo de la Corona y Florones / Cúspides Arqueadas -->
    <path d="M 42,37 
             L 39,23 
             Q 45,28 50,19 
             Q 55,27 60,9 
             Q 65,27 70,19 
             Q 75,28 81,23 
             L 78,37 Z" 
          fill="url(#alrocGoldGrad)" 
          stroke="#5B3E10" 
          stroke-width="0.9" 
          stroke-linejoin="round"/>

    <!-- Arco Interior y Filigrana de la Corona -->
    <path d="M 45,37 Q 60,25 75,37" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.1"/>

    <!-- Perlas & Diamantes en las Puntas de la Corona -->
    <!-- Punta Extrema Izquierda -->
    <circle cx="39" cy="22" r="2.2" fill="#FFFFFF" stroke="url(#alrocGoldGrad)" stroke-width="0.9"/>
    <!-- Punta Media Izquierda -->
    <circle cx="50" cy="18" r="2.3" fill="#FFFFFF" stroke="url(#alrocGoldGrad)" stroke-width="0.9"/>
    
    <!-- Cúspide Central Magna: Cruz Heráldica y Orbe Imperial -->
    <circle cx="60" cy="8.5" r="2.8" fill="#FFFFFF" stroke="url(#alrocGoldGrad)" stroke-width="1"/>
    <!-- Cruz Imperial de Remate -->
    <line x1="60" y1="2" x2="60" y2="6.5" stroke="url(#alrocGoldGrad)" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="57.5" y1="4" x2="62.5" y2="4" stroke="url(#alrocGoldGrad)" stroke-width="1.3" stroke-linecap="round"/>
    
    <!-- Punta Media Derecha -->
    <circle cx="70" cy="18" r="2.3" fill="#FFFFFF" stroke="url(#alrocGoldGrad)" stroke-width="0.9"/>
    <!-- Punta Extrema Derecha -->
    <circle cx="81" cy="22" r="2.2" fill="#FFFFFF" stroke="url(#alrocGoldGrad)" stroke-width="0.9"/>
  </g>
</svg>
