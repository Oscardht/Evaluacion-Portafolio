<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Estilo Airbnb — Inversiones D'ALROC</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        /* ===== RESET & VARIABLES ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --color-white: #FFFFFF;
            --color-magenta: #FF385C;
            --color-magenta-hover: #E00B41;
            --color-text-dark: #222222;
            --color-text-muted: #717171;
            --color-card-bg: #FFFFFF;
            --color-border-subtle: #EBEBEB;
            --color-hover-subtle: #F7F7F7;
            --shadow-float: 0 16px 36px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-float-hover: 0 20px 45px rgba(0, 0, 0, 0.25), 0 6px 16px rgba(0, 0, 0, 0.1);
            --radius-card: 28px;
            --radius-pill: 9999px;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: var(--font-sans);
            color: var(--color-text-dark);
            background-color: #0D0D0F;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== NAVEGACIÓN SUPERIOR MINIMALISTA ===== */
        .airbnb-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.8rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .airbnb-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            color: var(--color-white);
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.01em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        }

        .airbnb-logo i {
            color: var(--color-magenta);
            font-size: 1.6rem;
        }

        .airbnb-nav-links {
            display: flex;
            align-items: center;
            gap: 1.8rem;
        }

        .airbnb-nav-links a {
            text-decoration: none;
            color: var(--color-white);
            font-size: 0.95rem;
            font-weight: 600;
            transition: opacity 0.2s ease;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
        }

        .airbnb-nav-links a:hover {
            opacity: 0.85;
        }

        .airbnb-nav-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-pill);
            color: var(--color-white) !important;
            transition: all 0.25s ease !important;
        }

        .airbnb-nav-btn:hover {
            background: var(--color-white);
            color: var(--color-text-dark) !important;
            text-shadow: none !important;
        }

        /* ===== SECCIÓN HERO COMPLETA (100VH) ===== */
        .airbnb-hero {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 640px;
            background: url('img/isla-saona.jpg') center center / cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Capa sutil de oscurecimiento (overlay) */
        .airbnb-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.42) 0%,
                rgba(0, 0, 0, 0.28) 40%,
                rgba(0, 0, 0, 0.52) 100%
            );
            z-index: 1;
        }

        /* Contenedor centralizado */
        .airbnb-hero-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1050px;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: -3vh; /* Ubicación en el tercio superior */
        }

        /* ===== ENCABEZADO CENTRAL (TERCIO SUPERIOR) ===== */
        .airbnb-hero-title {
            font-family: var(--font-sans);
            font-size: clamp(2.3rem, 4.8vw, 3.75rem);
            font-weight: 800;
            color: var(--color-white);
            text-align: center;
            letter-spacing: -0.025em;
            line-height: 1.15;
            margin-bottom: 2.2rem;
            text-shadow: 0 3px 18px rgba(0, 0, 0, 0.45);
        }

        /* ===== WIDGET DE BÚSQUEDA FLOTANTE (COMPONENTE PRINCIPAL) ===== */
        .airbnb-search-widget {
            width: 100%;
            max-width: 860px;
            background: var(--color-card-bg);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-float);
            padding: 1.1rem 1.6rem 1.3rem 1.6rem;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .airbnb-search-widget:hover {
            box-shadow: var(--shadow-float-hover);
        }

        /* FILA SUPERIOR: PESTAÑAS (TABS) */
        .airbnb-widget-tabs {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2.5rem;
            border-bottom: 1px solid var(--color-border-subtle);
            padding-bottom: 0.8rem;
            margin-bottom: 0.9rem;
        }

        .airbnb-tab-btn {
            background: none;
            border: none;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 500;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: 0.4rem 0.2rem 0.6rem 0.2rem;
            position: relative;
            transition: color 0.2s ease;
        }

        .airbnb-tab-btn:hover {
            color: var(--color-text-dark);
        }

        /* Pestaña activa con subrayado */
        .airbnb-tab-btn.active {
            color: var(--color-text-dark);
            font-weight: 700;
        }

        .airbnb-tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -0.8rem;
            left: 0;
            width: 100%;
            height: 2.5px;
            background-color: var(--color-text-dark);
            border-radius: var(--radius-pill);
        }

        /* FILA INFERIOR: BARRA DE ENTRADAS DIVIDIDA HORIZONTALMENTE */
        .airbnb-inputs-bar {
            display: flex;
            align-items: center;
            background: var(--color-card-bg);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-pill);
            padding: 0.35rem 0.45rem 0.35rem 0.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        .airbnb-inputs-bar:focus-within {
            border-color: #B0B0B0;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        /* Campos Individuales */
        .airbnb-field-group {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.7rem 1.1rem;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-align: left;
        }

        .airbnb-field-group:hover {
            background-color: var(--color-hover-subtle);
        }

        .field-icon {
            font-size: 1.15rem;
            color: var(--color-text-dark);
            opacity: 0.85;
            flex-shrink: 0;
        }

        .field-texts {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        .field-label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--color-text-dark);
            text-transform: capitalize;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        .field-input {
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--font-sans);
            font-size: 0.92rem;
            color: var(--color-text-dark);
            font-weight: 500;
            width: 100%;
            padding: 0.15rem 0 0 0;
            text-overflow: ellipsis;
        }

        .field-input::placeholder {
            color: var(--color-text-muted);
            font-weight: 400;
        }

        /* Divisores Verticales entre Campos */
        .field-divider {
            width: 1px;
            height: 32px;
            background-color: var(--color-border-subtle);
            flex-shrink: 0;
        }

        /* BOTÓN CTA (EXTREMO DERECHO) */
        .airbnb-cta-btn {
            background-color: var(--color-magenta);
            color: var(--color-white);
            border: none;
            border-radius: var(--radius-pill);
            padding: 0.95rem 1.7rem;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 56, 92, 0.35);
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-left: 0.4rem;
        }

        .airbnb-cta-btn i {
            font-size: 0.95rem;
            color: var(--color-white);
        }

        .airbnb-cta-btn:hover {
            background-color: var(--color-magenta-hover);
            box-shadow: 0 6px 18px rgba(255, 56, 92, 0.48);
            transform: scale(1.02);
        }

        .airbnb-cta-btn:active {
            transform: scale(0.98);
        }

        /* ===== ENLACE SECUNDARIO ===== */
        .airbnb-secondary-wrap {
            margin-top: 1.4rem;
        }

        .airbnb-secondary-link {
            font-size: 14px;
            color: var(--color-white);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.01em;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
            position: relative;
            padding-bottom: 2px;
        }

        .airbnb-secondary-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: var(--color-white);
            transition: width 0.25s ease;
        }

        .airbnb-secondary-link:hover {
            opacity: 0.95;
        }

        .airbnb-secondary-link:hover::after {
            width: 100%;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 820px) {
            .airbnb-search-widget {
                padding: 1rem;
                border-radius: 24px;
            }

            .airbnb-inputs-bar {
                flex-direction: column;
                border-radius: 20px;
                padding: 0.8rem;
                gap: 0.6rem;
            }

            .field-divider {
                width: 100%;
                height: 1px;
                margin: 0.2rem 0;
            }

            .airbnb-field-group {
                width: 100%;
                padding: 0.6rem 0.8rem;
            }

            .airbnb-cta-btn {
                width: 100%;
                justify-content: center;
                margin-left: 0;
                margin-top: 0.4rem;
                border-radius: 16px;
                padding: 0.9rem;
            }

            .airbnb-widget-tabs {
                gap: 1.4rem;
            }

            .airbnb-tab-btn {
                font-size: 0.92rem;
            }

            .airbnb-nav-links a:not(.airbnb-nav-btn) {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- NAVEGACIÓN SUPERIOR -->
    <header class="airbnb-header">
        <a href="index.html" class="airbnb-logo">
            <i class="fa-solid fa-umbrella-beach"></i>
            <span>D'ALROC Real Estate</span>
        </a>
        <nav class="airbnb-nav-links">
            <a href="index.html#Ruta">Ruta de Inversión</a>
            <a href="index.html#Galeria">Propiedades</a>
            <a href="index.html#Contacto" class="airbnb-nav-btn">Publicar Inmueble</a>
        </nav>
    </header>

    <!-- SECCIÓN HERO COMPLETA (100VH) ESTILO AIRBNB -->
    <section class="airbnb-hero" id="hero">
        <!-- Capa sutil de oscurecimiento (overlay) -->
        <div class="airbnb-hero-overlay"></div>

        <div class="airbnb-hero-container">
            <!-- ENCABEZADO CENTRAL -->
            <h1 class="airbnb-hero-title">Encuentra tu hogar ideal en Margarita</h1>

            <!-- WIDGET DE BÚSQUEDA FLOTANTE (COMPONENTE PRINCIPAL) -->
            <div class="airbnb-search-widget">
                <!-- Fila superior (Pestañas) -->
                <div class="airbnb-widget-tabs" role="tablist" aria-label="Categorías de inmuebles">
                    <button class="airbnb-tab-btn active" role="tab" aria-selected="true" data-type="apartamentos">
                        Apartamentos
                    </button>
                    <button class="airbnb-tab-btn" role="tab" aria-selected="false" data-type="townhouse">
                        Town-House
                    </button>
                    <button class="airbnb-tab-btn" role="tab" aria-selected="false" data-type="alquiler">
                        Alquiler
                    </button>
                </div>

                <!-- Fila inferior (Barra de entradas dividida horizontalmente) -->
                <form class="airbnb-inputs-bar" id="airbnb-search-form" action="index.html#Galeria" method="GET">
                    <!-- Campo 1: [Icono Búsqueda] Ubicación -->
                    <div class="airbnb-field-group" onclick="document.getElementById('input-ubicacion').focus();">
                        <i class="fa-solid fa-magnifying-glass field-icon"></i>
                        <div class="field-texts">
                            <label for="input-ubicacion" class="field-label">Ubicación</label>
                            <input type="text" id="input-ubicacion" name="ubicacion" class="field-input" placeholder="Pampatar, Costa Azul..." autocomplete="off">
                        </div>
                    </div>

                    <div class="field-divider"></div>

                    <!-- Campo 2: [Icono Calendario] -->
                    <div class="airbnb-field-group" onclick="document.getElementById('input-calendario').focus();">
                        <i class="fa-regular fa-calendar field-icon"></i>
                        <div class="field-texts">
                            <label for="input-calendario" class="field-label">Calendario</label>
                            <input type="text" id="input-calendario" name="fechas" class="field-input" placeholder="Llegada / Salida" autocomplete="off">
                        </div>
                    </div>

                    <div class="field-divider"></div>

                    <!-- Campo 3: [Icono Usuario] Alquiler -->
                    <div class="airbnb-field-group" onclick="document.getElementById('input-alquiler').focus();">
                        <i class="fa-regular fa-user field-icon"></i>
                        <div class="field-texts">
                            <label for="input-alquiler" class="field-label">Alquiler</label>
                            <input type="text" id="input-alquiler" name="huespedes" class="field-input" placeholder="¿Cuántas personas?" autocomplete="off">
                        </div>
                    </div>

                    <!-- Botón CTA (Extremo derecho) -->
                    <button type="submit" class="airbnb-cta-btn" id="btn-buscar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Buscar</span>
                    </button>
                </form>
            </div>

            <!-- ENLACE SECUNDARIO -->
            <div class="airbnb-secondary-wrap">
                <a href="index.html#Galeria" class="airbnb-secondary-link">Cerca de ti &gt;</a>
            </div>
        </div>
    </section>

    <!-- SCRIPT INTERACTIVO DE PESTAÑAS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.airbnb-tab-btn');
            const inputUbicacion = document.getElementById('input-ubicacion');

            tabs.forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    tabs.forEach(t => {
                        t.classList.remove('active');
                        t.setAttribute('aria-selected', 'false');
                    });
                    tab.classList.add('active');
                    tab.setAttribute('aria-selected', 'true');

                    const category = tab.getAttribute('data-type');
                    if (category === 'apartamentos') {
                        inputUbicacion.placeholder = 'Pampatar, Costa Azul, Playa El Ángel...';
                    } else if (category === 'townhouse') {
                        inputUbicacion.placeholder = 'Villas de Lujo, Jorge Coll...';
                    } else if (category === 'alquiler') {
                        inputUbicacion.placeholder = 'Alquiler vacacional o de largo plazo...';
                    }
                });
            });
        });
    </script>

</body>
</html>
